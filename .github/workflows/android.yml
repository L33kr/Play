name: Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ShikiMove-0.2.1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ShikiMove-0.2.1-debug
          path: release
      - name: Publish verified test APK once
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          if gh release view v0.2.1 >/dev/null 2>&1; then
            echo "v0.2.1 already exists; published assets are kept unchanged."
            exit 0
          fi
          mv release/app-debug.apk release/ShikiMove-0.2.1-debug.apk
          (cd release && sha256sum ShikiMove-0.2.1-debug.apk > SHA256SUMS)
          gh release create v0.2.1 release/ShikiMove-0.2.1-debug.apk release/SHA256SUMS --target "$COMMIT" --title "ShikiMove 0.2.1" --notes-file RELEASE_NOTES.md --prerelease
